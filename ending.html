<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小江打手槍 - 結局與製作團隊名單</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #credits-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    z-index: 10;
    background: #000;
  }

  /* 加快捲動速度：調整為 7 秒快速捲完 */
  #credits-track {
    position: absolute;
    top: 100%;
    width: 90%;
    max-width: 680px;
    text-align: center;
    animation: scrollCredits 7s linear forwards;
  }

  @keyframes scrollCredits {
    0% {
      top: 100%;
      opacity: 0;
    }
    4% {
      opacity: 1;
    }
    92% {
      opacity: 1;
    }
    100% {
      top: -150%;
      opacity: 0;
    }
  }

  .game-title {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #f1c40f;
    text-shadow: 0 0 20px rgba(241, 196, 15, 0.8), 3px 3px 0 #c0392b;
    margin-bottom: 70px;
  }

  .credit-row {
    margin-bottom: 50px;
  }

  .role-title {
    font-size: 26px;
    font-weight: 600;
    color: #bdc3c7;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
  }

  .name-text {
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  }

  #final-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease-in-out;
    background-color: #000;
    z-index: 20;
  }

  #final-screen.show {
    opacity: 1;
    pointer-events: auto;
  }

  .ending-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: 100%;
    object-fit: contain;
    display: block;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
  }

  .home-btn {
    position: absolute;
    bottom: 24px;
    right: 24px;
    padding: 12px 26px;
    background: rgba(30, 39, 46, 0.85);
    border: 2px solid #f39c12;
    border-radius: 30px;
    color: #f1c40f;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    transition: all 0.2s ease;
    z-index: 30;
  }

  .home-btn:hover {
    background: #f39c12;
    color: #000;
    box-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
  }

  .home-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<!-- 背景音樂元件 -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<div id="credits-container">
  <div id="credits-track">
    <div class="game-title">小江打手槍</div>

    <div class="credit-row">
      <div class="role-title">導演</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">編劇</div>
      <div class="name-text">aa38、Hayley</div>
    </div>

    <div class="credit-row">
      <div class="role-title">美術設計</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">動作設計</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">製作</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">靈感來源</div>
      <div class="name-text">小江放心說</div>
    </div>
  </div>
</div>

<div id="final-screen">
  <img src="結局畫面.png" alt="結局畫面" class="ending-img">
  <a href="index.html" class="home-btn">🏠 返回主選單</a>
</div>

<script>
  const creditsTrack = document.getElementById('credits-track');
  const creditsContainer = document.getElementById('credits-container');
  const finalScreen = document.getElementById('final-screen');
  const bgm = document.getElementById('bgm');

  function startBGM() {
    if (bgm && bgm.paused) {
      bgm.play().catch(() => {});
    }
  }

  // 進入頁面嘗試播放，並設定初次觸控/點擊備援啟動
  startBGM();
  window.addEventListener('click', startBGM, { once: true });
  window.addEventListener('touchstart', startBGM, { once: true });

  creditsTrack.addEventListener('animationend', () => {
    creditsContainer.style.display = 'none';
    finalScreen.classList.add('show');
  });
</script>

</body>
</html>
