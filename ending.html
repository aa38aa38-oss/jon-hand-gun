<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小江打手槍 - 結局與製作團隊名單</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 開場對話框容器 */
  #intro-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 0.5s ease;
  }

  .dialog-panel {
    background: rgba(15, 23, 42, 0.96);
    border: 3px solid #f39c12;
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
    color: #fff;
    max-width: 440px;
    width: 88%;
    box-shadow: 0 0 30px rgba(243, 156, 18, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .dialog-panel h3 {
    margin: 0 0 14px 0;
    color: #f1c40f;
    font-size: 20px;
    letter-spacing: 1px;
  }

  .dialog-img {
    max-width: 170px;
    max-height: 130px;
    object-fit: contain;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4));
  }

  .dialog-panel p {
    font-size: 16px;
    font-weight: bold;
    line-height: 1.6;
    color: #ffeaa7;
    margin: 0 0 20px 0;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
  }

  .dialog-btn {
    background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
    color: #fff;
    border: 2px solid #f1c40f;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
    transition: transform 0.1s ease, filter 0.2s;
  }

  .dialog-btn:hover {
    filter: brightness(1.15);
  }

  .dialog-btn:active {
    transform: scale(0.95);
  }

  #credits-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    z-index: 10;
    background: #000;
  }

  /* 初始暫停動畫，點擊按鈕後加上 .running 啟動跑馬燈 */
  #credits-track {
    position: absolute;
    top: 100%;
    width: 90%;
    max-width: 680px;
    text-align: center;
    animation: scrollCredits 7s linear forwards;
    animation-play-state: paused;
  }

  #credits-track.running {
    animation-play-state: running;
  }

  @keyframes scrollCredits {
    0% {
      top: 100%;
      opacity: 0;
    }
    4% {
      opacity: 1;
    }
    92% {
      opacity: 1;
    }
    100% {
      top: -150%;
      opacity: 0;
    }
  }

  .game-title {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #f1c40f;
    text-shadow: 0 0 20px rgba(241, 196, 15, 0.8), 3px 3px 0 #c0392b;
    margin-bottom: 70px;
  }

  .credit-row {
    margin-bottom: 50px;
  }

  .role-title {
    font-size: 26px;
    font-weight: 600;
    color: #bdc3c7;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
  }

  .name-text {
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  }

  #final-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease-in-out;
    background-color: #000;
    z-index: 20;
  }

  #final-screen.show {
    opacity: 1;
    pointer-events: auto;
  }

  .ending-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: 100%;
    object-fit: contain;
    display: block;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
  }

  .home-btn {
    position: absolute;
    bottom: 24px;
    right: 24px;
    padding: 12px 26px;
    background: rgba(30, 39, 46, 0.85);
    border: 2px solid #f39c12;
    border-radius: 30px;
    color: #f1c40f;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    transition: all 0.2s ease;
    z-index: 30;
  }

  .home-btn:hover {
    background: #f39c12;
    color: #000;
    box-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
  }

  .home-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<!-- 背景音樂元件 -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<!-- 開場小江感謝對話框 -->
<div id="intro-modal">
  <div class="dialog-panel">
    <h3>✨ 小江的真摯感謝</h3>
    <img src="小江蹲下.png" alt="小江蹲下" class="dialog-img">
    <p>小江：「感謝你的手槍，一起拯救這個破亂世界」</p>
    <button class="dialog-btn" onclick="startEndingSequence()">開啟謝幕</button>
  </div>
</div>

<div id="credits-container">
  <div id="credits-track">
    <div class="game-title">小江打手槍</div>

    <div class="credit-row">
      <div class="role-title">導演</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">編劇</div>
      <div class="name-text">aa38、Hayley</div>
    </div>

    <div class="credit-row">
      <div class="role-title">美術設計</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">動作設計</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">製作</div>
      <div class="name-text">aa38</div>
    </div>

    <div class="credit-row">
      <div class="role-title">靈感來源</div>
      <div class="name-text">小江放心說</div>
    </div>
  </div>
</div>

<div id="final-screen">
  <img src="結局畫面.png" alt="結局畫面" class="ending-img">
  <a href="index.html" class="home-btn">🏠 返回主選單</a>
</div>

<script>
  const creditsTrack = document.getElementById('credits-track');
  const creditsContainer = document.getElementById('credits-container');
  const finalScreen = document.getElementById('final-screen');
  const introModal = document.getElementById('intro-modal');
  const bgm = document.getElementById('bgm');

  function startEndingSequence() {
    // 播放音樂
    if (bgm && bgm.paused) {
      bgm.play().catch(() => {});
    }

    // 淡出並關閉對話框
    introModal.style.opacity = '0';
    setTimeout(() => {
      introModal.style.display = 'none';
    }, 500);

    // 啟動團隊名單滾動
    creditsTrack.classList.add('running');
  }

  creditsTrack.addEventListener('animationend', () => {
    creditsContainer.style.display = 'none';
    finalScreen.classList.add('show');
  });
</script>

</body>
</html>
