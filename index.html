<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小江打手槍 - 遊戲主頁</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg-poster {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: 100%;
    object-fit: contain;
    display: block;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
  }
  .start-btn {
    position: absolute;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 36px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
    text-decoration: none;
    background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
    border: 3px solid #f1c40f;
    border-radius: 50px;
    box-shadow: 0 0 20px rgba(243, 156, 18, 0.75), 0 5px 0 #872800;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    z-index: 10;
  }
  .start-btn:hover {
    filter: brightness(1.15);
    box-shadow: 0 0 28px rgba(241, 196, 15, 0.95), 0 5px 0 #872800;
  }
  .start-btn:active {
    transform: translate(-50%, 4px);
    box-shadow: 0 0 14px rgba(243, 156, 18, 0.6), 0 1px 0 #872800;
  }
</style>
</head>
<body>

<div class="screen-wrapper">
  <img src="首頁.png" alt="遊戲主頁海報" class="bg-poster">
  <a href="stage1.html" class="start-btn">開始遊戲</a>
</div>

</body>
</html>
