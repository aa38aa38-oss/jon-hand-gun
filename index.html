<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小江打手槍 - 第一關：三重國中 (自動試玩除錯版)</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #2c3e50;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    object-fit: contain;
  }
  /* 虛擬控制器層 */
  #touch-controls {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .v-btn {
    pointer-events: auto;
    position: absolute;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .v-btn:active {
    background: rgba(243, 156, 18, 0.65);
    border-color: #f39c12;
  }
  /* 左側十字方向鍵 */
  #btn-up    { left: 75px;  bottom: 120px; width: 48px; height: 48px; }
  #btn-down  { left: 75px;  bottom: 24px;  width: 48px; height: 48px; }
  #btn-left  { left: 20px;  bottom: 72px;  width: 48px; height: 48px; }
  #btn-right { left: 130px; bottom: 72px;  width: 48px; height: 48px; }

  /* 右側動作按鈕 */
  #btn-shoot  { right: 135px; bottom: 35px;  width: 62px; height: 62px; background: rgba(231, 76, 60, 0.4); }
  #btn-jump   { right: 45px;  bottom: 110px; width: 62px; height: 62px; background: rgba(46, 204, 113, 0.4); }
  #btn-dash   { right: 35px;  bottom: 25px;  width: 52px; height: 52px; }
  #btn-weapon { right: 125px; bottom: 125px; width: 52px; height: 52px; font-size: 13px; background: rgba(52, 152, 219, 0.4); }

  /* 常駐除錯狀態面板 */
  #debug-dashboard {
    pointer-events: auto;
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #2ecc71;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: monospace, sans-serif;
    font-size: 12px;
    color: #fff;
    z-index: 100;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  #debug-status {
    color: #2ecc71;
    font-weight: bold;
  }
  #toggle-switch {
    margin-top: 5px;
    background: #e74c3c;
    color: #fff;
    border: none;
    padding: 4px 8px;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="450"></canvas>
  
  <!-- 右上角常駐除錯儀表板 -->
  <div id="debug-dashboard">
    <div><strong>[自動除錯與試玩系統]</strong></div>
    <div id="debug-status">狀態：🟢 自動試玩中</div>
    <div id="debug-frames">幀數：0</div>
    <div id="debug-bullets">畫面上子彈：0 發</div>
    <div id="debug-check">物理檢查：正常 (無穿透)</div>
    <button id="toggle-switch">暫停自動試玩 (切手動)</button>
  </div>

  <div id="touch-controls">
    <!-- 左側方向鍵 -->
    <div class="v-btn" id="btn-up" data-code="KeyW">▲</div>
    <div class="v-btn" id="btn-down" data-code="KeyS">▼</div>
    <div class="v-btn" id="btn-left" data-code="KeyA">◀</div>
    <div class="v-btn" id="btn-right" data-code="KeyD">▶</div>

    <!-- 右側動作鍵 -->
    <div class="v-btn" id="btn-shoot" data-code="KeyJ">射擊</div>
    <div class="v-btn" id="btn-jump" data-code="KeyK">跳躍</div>
    <div class="v-btn" id="btn-dash" data-code="KeyL">衝刺</div>
    <div class="v-btn" id="btn-weapon">換槍</div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 鍵盤輸入狀態
const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Digit1") player.weapon = "PISTOL";
  if (e.code === "Digit2") player.weapon = "SHOTGUN";
  if (e.code === "KeyT") toggleBot();
});
window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

// 手機多點觸控映射
const touchButtons = document.querySelectorAll(".v-btn[data-code]");
touchButtons.forEach((btn) => {
  const code = btn.getAttribute("data-code");
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!autoBot.enabled) keys[code] = true;
  }, { passive: false });
  btn.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (!autoBot.enabled) keys[code] = false;
  }, { passive: false });
  btn.addEventListener("touchcancel", (e) => {
    e.preventDefault();
    if (!autoBot.enabled) keys[code] = false;
  }, { passive: false });
});

// 換槍按鈕
const weaponBtn = document.getElementById("btn-weapon");
weaponBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  player.weapon = (player.weapon === "PISTOL") ? "SHOTGUN" : "PISTOL";
}, { passive: false });

document.addEventListener("touchmove", (e) => {
  e.preventDefault();
}, { passive: false });

// 地形平台
const platforms = [
  { x: 0, y: 400, w: 800, h: 50 },
  { x: 120, y: 310, w: 140, h: 15 },
  { x: 330, y: 240, w: 150, h: 15 },
  { x: 550, y: 310, w: 140, h: 15 }
];

// 子彈系統
const bullets = [];

class Bullet {
  constructor(x, y, vx, vy, damage, type) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.type = type;
    this.isDead = false;
    this.life = 120;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0 || this.x < -20 || this.x > canvas.width + 20 || this.y < -20 || this.y > canvas.height + 20) {
      this.isDead = true;
    }
  }
  draw() {
    ctx.save();
    ctx.fillStyle = this.type === "SHOTGUN" ? "#e67e22" : "#f1c40f";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.type === "SHOTGUN" ? 4 : 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// 主角小江
const player = {
  x: 80,
  y: 330,
  w: 36,
  h: 64,
  crouchH: 34,
  vx: 0,
  vy: 0,
  speed: 4.2,
  jumpForce: -12.5,
  gravity: 0.65,
  friction: 0.8,
  facing: 1,
  aimDir: { x: 1, y: 0 },
  isOnGround: false,
  isCrouching: false,
  isDashing: false,
  dashTimer: 0,
  dashCooldown: 0,
  shootCooldown: 0,
  weapon: "PISTOL",
  hp: 100,

  update() {
    if (this.dashCooldown > 0) this.dashCooldown--;

    const isDownPressed = keys["KeyS"] || keys["ArrowDown"];
    this.isCrouching = isDownPressed && this.isOnGround;

    const isLeft = keys["KeyA"] || keys["ArrowLeft"];
    const isRight = keys["KeyD"] || keys["ArrowRight"];
    let moveSpeed = this.isCrouching ? 0 : this.speed;

    if (isLeft) {
      this.vx = -moveSpeed;
      this.facing = -1;
    } else if (isRight) {
      this.vx = moveSpeed;
      this.facing = 1;
    } else {
      this.vx *= this.friction;
      if (Math.abs(this.vx) < 0.2) this.vx = 0;
    }

    const isDashPressed = keys["KeyL"] || keys["ShiftLeft"];
    if (isDashPressed && this.dashCooldown === 0 && !this.isCrouching) {
      this.isDashing = true;
      this.dashTimer = 8;
      this.dashCooldown = 40;
      this.vx = this.facing * 10.5;
    }
    if (this.isDashing) {
      this.dashTimer--;
      if (this.dashTimer <= 0) this.isDashing = false;
    }

    const isJumpPressed = keys["KeyK"] || keys["Space"];
    if (isJumpPressed && this.isOnGround && !this.isCrouching) {
      this.vy = this.jumpForce;
      this.isOnGround = false;
    }

    const isUpPressed = keys["KeyW"] || keys["ArrowUp"];
    let dirX = this.facing;
    let dirY = 0;

    if (isUpPressed) {
      dirY = -1;
      if (!isLeft && !isRight) dirX = 0;
    } else if (isDownPressed && !this.isOnGround) {
      dirY = 1;
      if (!isLeft && !isRight) dirX = 0;
    }
    const len = Math.hypot(dirX, dirY) || 1;
    this.aimDir = { x: dirX / len, y: dirY / len };

    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;

    const currentHeight = this.isCrouching ? this.crouchH : this.h;
    this.isOnGround = false;

    for (let p of platforms) {
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (this.y + currentHeight >= p.y && this.y + currentHeight <= p.y + p.h + Math.max(0, this.vy)) {
          this.y = p.y - currentHeight;
          this.vy = 0;
          this.isOnGround = true;
        }
      }
    }

    if (this.x < 0) this.x = 0;
    if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (keys["KeyJ"] && this.shootCooldown === 0) {
      this.fire();
    }
  },

  fire() {
    const currentHeight = this.isCrouching ? this.crouchH : this.h;
    let startX = this.x + (this.facing === 1 ? this.w : 0);
    let startY = this.y + currentHeight * 0.35;

    if (this.aimDir.y === -1 && this.aimDir.x === 0) {
      startX = this.x + this.w / 2;
      startY = this.y;
    }

    if (this.weapon === "PISTOL") {
      bullets.push(new Bullet(startX, startY, this.aimDir.x * 12, this.aimDir.y * 12, 12, "PISTOL"));
      this.shootCooldown = 11;
    } else if (this.weapon === "SHOTGUN") {
      for (let offset of [-0.25, -0.12, 0, 0.12, 0.25]) {
        const spreadX = this.aimDir.x * Math.cos(offset) - this.aimDir.y * Math.sin(offset);
        const spreadY = this.aimDir.x * Math.sin(offset) + this.aimDir.y * Math.cos(offset);
        bullets.push(new Bullet(startX, startY, spreadX * 10, spreadY * 10, 8, "SHOTGUN"));
      }
      this.shootCooldown = 26;
    }
  },

  draw() {
    const currentHeight = this.isCrouching ? this.crouchH : this.h;
    ctx.save();

    ctx.fillStyle = this.isCrouching ? "#2980b9" : "#3498db";
    ctx.fillRect(this.x, this.y, this.w, currentHeight);

    ctx.fillStyle = "#f39c12";
    const headSize = 14;
    const headX = this.facing === 1 ? this.x + this.w - headSize : this.x;
    ctx.fillRect(headX, this.y + 4, headSize, headSize);

    let muzzleX = this.x + (this.facing === 1 ? this.w : 0);
    let muzzleY = this.y + currentHeight * 0.35;
    if (this.aimDir.y === -1 && this.aimDir.x === 0) {
      muzzleX = this.x + this.w / 2;
      muzzleY = this.y;
    }
    ctx.strokeStyle = "#e74c3c";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(muzzleX, muzzleY);
    ctx.lineTo(muzzleX + this.aimDir.x * 16, muzzleY + this.aimDir.y * 16);
    ctx.stroke();

    ctx.restore();
  }
};

// 測試假人
const dummy = {
  x: 680,
  y: 336,
  w: 40,
  h: 64,
  hp: 200,
  maxHp: 200,
  hitFlash: 0,
  update() {
    if (this.hitFlash > 0) this.hitFlash--;
    for (let b of bullets) {
      if (!b.isDead) {
        if (b.x > this.x && b.x < this.x + this.w && b.y > this.y && b.y < this.y + this.h) {
          this.hp -= b.damage;
          this.hitFlash = 4;
          b.isDead = true;
          if (this.hp <= 0) this.hp = this.maxHp;
        }
      }
    }
  },
  draw() {
    ctx.save();
    ctx.fillStyle = this.hitFlash > 0 ? "#ffffff" : "#c0392b";
    ctx.fillRect(this.x, this.y, this.w, this.h);

    ctx.fillStyle = "#555";
    ctx.fillRect(this.x - 5, this.y - 14, 50, 6);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(this.x - 5, this.y - 14, (this.hp / this.maxHp) * 50, 6);
    ctx.restore();
  }
};

// --- 自動試玩與防呆偵錯模組 ---
const autoBot = {
  enabled: true, // 預設直接啟動
  frameCounter: 0,
  hasError: false,
  errorMsg: "",

  update() {
    if (!this.enabled) return;
    this.frameCounter++;

    // 每 12 幀高頻率隨機模擬按鍵
    if (this.frameCounter % 12 === 0) {
      keys["KeyA"] = Math.random() < 0.45;
      keys["KeyD"] = Math.random() < 0.55;
      keys["KeyW"] = Math.random() < 0.3;
      keys["KeyS"] = Math.random() < 0.25;
      keys["KeyK"] = Math.random() < 0.35; // 跳躍
      keys["KeyL"] = Math.random() < 0.2;  // 衝刺
      keys["KeyJ"] = Math.random() < 0.85; // 射擊
    }

    // 每 60 幀隨機切換武器
    if (this.frameCounter % 60 === 0) {
      player.weapon = Math.random() > 0.5 ? "SHOTGUN" : "PISTOL";
    }

    // 物理與數值安全監控
    this.checkErrors();
  },

  checkErrors() {
    const pHeight = player.isCrouching ? player.crouchH : player.h;
    if (player.y + pHeight > 402) {
      this.hasError = true;
      this.errorMsg = `穿地警告：Y=${player.y.toFixed(1)}`;
    } else if (player.y < -50 || isNaN(player.y)) {
      this.hasError = true;
      this.errorMsg = `浮空溢出：Y=${player.y}`;
    } else if (bullets.length > 80) {
      this.hasError = true;
      this.errorMsg = `子彈洩漏：${bullets.length} 發`;
    }
  }
};

// 更新右上角資訊儀表板
const domStatus = document.getElementById("debug-status");
const domFrames = document.getElementById("debug-frames");
const domBullets = document.getElementById("debug-bullets");
const domCheck = document.getElementById("debug-check");
const toggleBtn = document.getElementById("toggle-switch");

function toggleBot() {
  autoBot.enabled = !autoBot.enabled;
  if (autoBot.enabled) {
    domStatus.innerText = "狀態：🟢 自動試玩中";
    domStatus.style.color = "#2ecc71";
    toggleBtn.innerText = "暫停自動試玩 (切手動)";
    toggleBtn.style.background = "#e74c3c";
  } else {
    domStatus.innerText = "狀態：⚪ 手動模式";
    domStatus.style.color = "#aaa";
    toggleBtn.innerText = "啟動自動試玩除錯";
    toggleBtn.style.background = "#27ae60";
    for (let k in keys) keys[k] = false;
  }
}
toggleBtn.addEventListener("click", toggleBot);

// 主遊戲迴圈
function gameLoop() {
  autoBot.update();
  player.update();
  dummy.update();

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].update();
    if (bullets[i].isDead) bullets.splice(i, 1);
  }

  // 更新除錯文字
  if (autoBot.enabled) {
    domFrames.innerText = `幀數：${autoBot.frameCounter}`;
    domBullets.innerText = `畫面上子彈：${bullets.length} 發`;
    if (autoBot.hasError) {
      domCheck.innerText = `⚠️ ${autoBot.errorMsg}`;
      domCheck.style.color = "#e74c3c";
    } else {
      domCheck.innerText = "物理檢查：正常 (無穿透/無洩漏)";
      domCheck.style.color = "#2ecc71";
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景與黑板
  ctx.fillStyle = "#273746";
  ctx.fillRect(0, 0, canvas.width, 400);
  ctx.fillStyle = "#1e8449";
  ctx.fillRect(260, 60, 280, 110);
  ctx.fillStyle = "#ffffff";
  ctx.font = "16px sans-serif";
  ctx.fillText("三重國中 - 3年8班", 330, 110);

  // 平台
  ctx.fillStyle = "#7f8c8d";
  for (let p of platforms) {
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  // 角色與物件
  dummy.draw();
  player.draw();
  for (let b of bullets) {
    b.draw();
  }

  // 左上方 HUD
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px monospace";
  ctx.fillText(`武器: ${player.weapon}`, 15, 25);
  ctx.fillText(`狀態: ${player.isCrouching ? "蹲下" : player.isDashing ? "衝刺中" : "站立"}`, 15, 45);

  requestAnimationFrame(gameLoop);
}

// 啟動遊戲
gameLoop();
</script>
</body>
</html>
