<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小江打手槍 - 遊戲主選單</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at center, #1b2838 0%, #080d15 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .menu-container {
    width: 90%;
    max-width: 580px;
    background: rgba(16, 24, 38, 0.88);
    border: 2px solid #f39c12;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(243, 156, 18, 0.35);
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 32px;
    letter-spacing: 3px;
    color: #f1c40f;
    text-shadow: 0 0 10px rgba(241, 196, 15, 0.6), 2px 2px 0 #c0392b;
  }
  .subtitle {
    font-size: 13px;
    color: #95a5a6;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .menu-btn {
    display: block;
    width: 100%;
    padding: 13px 0;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: transform 0.1s, background-color 0.2s;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-start {
    background: linear-gradient(180deg, #e67e22 0%, #d35400 100%);
    border: 1px solid #f39c12;
    box-shadow: 0 4px 10px rgba(211, 84, 0, 0.4);
    font-size: 19px;
  }
  .btn-stage {
    background: #2c3e50;
  }
  .menu-btn:active {
    transform: scale(0.97);
    filter: brightness(1.2);
  }
  .info-box {
    background: rgba(0, 0, 0, 0.45);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: #bdc3c7;
    text-align: left;
    line-height: 1.6;
  }
  .info-title {
    color: #f39c12;
    font-weight: bold;
    margin-bottom: 4px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="menu-container">
  <h1>小江打手槍</h1>
  <div class="subtitle">2D 街機動作橫向射擊 - 關卡傳送門</div>

  <div class="btn-group">
    <a href="stage1.html" class="menu-btn btn-start">🚀 從頭開始遊戲</a>
    <a href="stage1.html" class="menu-btn btn-stage">第一關：三重國中 (BOSS 力維哥)</a>
    <a href="stage2.html" class="menu-btn btn-stage">第二關：三重集美街 (BOSS 加拿大老謝)</a>
    <a href="stage3.html" class="menu-btn btn-stage">第三關：泰國曼谷街景 (BOSS 惡魔小江)</a>
  </div>

  <div class="info-box">
    <div class="info-title">【操作指南】</div>
    <div>• 移動與瞄準：A / D 左右移動、W 向上瞄準、S 蹲下避彈</div>
    <div>• 戰鬥動作：J 射擊、K / 空白鍵 跳躍、L 衝刺、數字鍵切換武器</div>
    <div>• 手機支援：開啟手機自動旋轉橫向全螢幕，畫面兩側備有虛擬觸控按鈕。</div>
  </div>
</div>

</body>
</html>
