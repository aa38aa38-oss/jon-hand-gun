<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小江打手槍 - 第一關：三重國中</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #main-layout {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100vw;
    height: 100vh;
    background-color: #050505;
  }
  .control-panel {
    position: relative;
    width: 130px;
    height: 100%;
    flex-shrink: 0;
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #canvas-container {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  canvas {
    display: block;
    background: #1c2833;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
  }
  #home-btn {
    position: absolute;
    top: 14px;
    right: 12px;
    background: rgba(52, 73, 94, 0.85);
    border: 1px solid #7f8c8d;
    color: #ecf0f1;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: background 0.2s;
  }
  #home-btn:active {
    background: #e67e22;
    border-color: #f39c12;
  }
  .v-btn {
    position: absolute;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .v-btn:active {
    background: rgba(243, 156, 18, 0.7);
    border-color: #f39c12;
  }
  #btn-up    { left: 41px; bottom: 135px; width: 48px; height: 48px; font-size: 13px; }
  #btn-down  { left: 41px; bottom: 35px;  width: 48px; height: 48px; }
  #btn-left  { left: 8px;  bottom: 85px;  width: 48px; height: 48px; }
  #btn-right { left: 74px; bottom: 85px;  width: 48px; height: 48px; }

  #btn-shoot  { left: 10px; bottom: 40px;  width: 54px; height: 54px; background: rgba(231, 76, 60, 0.45); }
  #btn-jump   { right: 10px; bottom: 105px; width: 54px; height: 54px; background: rgba(46, 204, 113, 0.45); }
  #btn-dash   { right: 10px; bottom: 35px;  width: 46px; height: 46px; }
  #btn-weapon { left: 10px; bottom: 115px; width: 48px; height: 48px; font-size: 12px; background: rgba(52, 152, 219, 0.45); }

  #victory-panel {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20, 20, 20, 0.95);
    border: 3px solid #f1c40f;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    color: #fff;
    font-family: sans-serif;
    z-index: 50;
    min-width: 280px;
  }
  #victory-panel h2 { color: #f1c40f; margin: 0 0 10px 0; }
  #victory-panel p { color: #ccc; font-size: 14px; line-height: 1.6; }
  #next-btn {
    background: #e67e22;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div id="main-layout">
  <div class="control-panel" id="left-panel">
    <div class="v-btn" id="btn-up" data-code="KeyW">跳</div>
    <div class="v-btn" id="btn-down" data-code="KeyS">▼</div>
    <div class="v-btn" id="btn-left" data-code="KeyA">◀</div>
    <div class="v-btn" id="btn-right" data-code="KeyD">▶</div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="victory-panel">
      <h2>🎉 第一關 突破！</h2>
      <p>小江成功打倒校園惡霸【力維哥】！<br>正義獲得伸張，準備前往三重集美街！</p>
      <button id="next-btn" onclick="window.location.href='stage2.html'">前往第二關：三重集美街</button>
    </div>
  </div>

  <div class="control-panel" id="right-panel">
    <a href="index.html" id="home-btn">🏠 首頁</a>
    <div class="v-btn" id="btn-shoot" data-code="KeyJ">射擊</div>
    <div class="v-btn" id="btn-jump" data-code="KeyK">跳躍</div>
    <div class="v-btn" id="btn-dash" data-code="KeyL">衝刺</div>
    <div class="v-btn" id="btn-weapon">換槍</div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- 圖檔資源管理 ---
const imgPlayerStand = new Image();
imgPlayerStand.src = "小江站立.png";
let isStandLoaded = false;
imgPlayerStand.onload = () => { isStandLoaded = true; };

const imgPlayerShoot = new Image();
imgPlayerShoot.src = "小江射擊.png";
let isShootLoaded = false;
imgPlayerShoot.onload = () => { isShootLoaded = true; };

const imgPlayerCrouch = new Image();
imgPlayerCrouch.src = "小江蹲下.png";
let isCrouchLoaded = false;
imgPlayerCrouch.onload = () => { isCrouchLoaded = true; };

const imgPlayerJump = new Image();
imgPlayerJump.src = "小江跳躍.png";
let isJumpLoaded = false;
imgPlayerJump.onload = () => { isJumpLoaded = true; };

const imgPlayerDash1 = new Image();
imgPlayerDash1.src = "小江衝刺1.png";
let isDash1Loaded = false;
imgPlayerDash1.onload = () => { isDash1Loaded = true; };

const imgPlayerDash2 = new Image();
imgPlayerDash2.src = "小江衝刺2.png";
let isDash2Loaded = false;
imgPlayerDash2.onload = () => { isDash2Loaded = true; };

// --- 雙向對稱動作特效粒子系統 ---
const fxEffects = [];

class ActionFX {
  constructor(x, y, vx, vy, length, width, color, life, type = "LINE") {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.length = length;
    this.width = width;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.type = type;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
  draw(camX) {
    ctx.save();
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.width;
    ctx.lineCap = "round";

    if (this.type === "LINE") {
      ctx.beginPath();
      ctx.moveTo(this.x - camX, this.y);
      ctx.lineTo(this.x - camX - this.vx * this.length, this.y - this.vy * this.length);
      ctx.stroke();
    } else if (this.type === "DUST") {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x - camX, this.y, this.width * (1 - alpha + 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function spawnDashLines(x, y, w, dir, isAir) {
  const originX = dir === 1 ? x : x + w;
  for (let i = 0; i < 4; i++) {
    const offsetY = (Math.random() - 0.5) * 75;
    fxEffects.push(new ActionFX(
      originX - dir * (Math.random() * 25),
      y + 55 + offsetY,
      dir * (12 + Math.random() * 8),
      (Math.random() - 0.5) * 1.5,
      2.5,
      2.5 + Math.random() * 2,
      "#ffffff",
      12,
      "LINE"
    ));
  }

  if (!isAir) {
    for (let i = 0; i < 2; i++) {
      fxEffects.push(new ActionFX(
        originX - dir * 10,
        y + 132 + (Math.random() - 0.5) * 6,
        -dir * (3 + Math.random() * 4),
        -Math.random() * 2.5,
        0,
        5 + Math.random() * 4,
        "rgba(240, 240, 240, 0.75)",
        15,
        "DUST"
      ));
    }
  }
}

function spawnJumpBurst(x, y, w, dir, isDouble, isDashJump) {
  const lineCount = isDashJump ? 12 : isDouble ? 9 : 7;
  const color = isDashJump ? "#f1c40f" : "#ffffff";
  const centerX = x + w / 2;

  for (let i = 0; i < lineCount; i++) {
    let angle;
    if (isDashJump) {
      const baseAngle = dir === 1 ? Math.PI * 0.75 : Math.PI * 0.25;
      angle = baseAngle + (Math.random() - 0.5) * 0.7;
    } else {
      angle = (Math.PI / 2) + (Math.random() - 0.5) * 1.3;
    }
    const speed = 7 + Math.random() * 9;
    fxEffects.push(new ActionFX(
      centerX + (Math.random() - 0.5) * 35,
      y + 130,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      2.2,
      2.5 + Math.random() * 2,
      color,
      14,
      "LINE"
    ));
  }
}

// 雙擊方向鍵判定
let lastTapTimeLeft = 0;
let lastTapTimeRight = 0;
const DOUBLE_TAP_THRESHOLD = 250;

function handleDirectionPress(dir) {
  const now = Date.now();
  if (dir === "left") {
    if (now - lastTapTimeLeft < DOUBLE_TAP_THRESHOLD) player.startDash(-1);
    lastTapTimeLeft = now;
  } else if (dir === "right") {
    if (now - lastTapTimeRight < DOUBLE_TAP_THRESHOLD) player.startDash(1);
    lastTapTimeRight = now;
  }
}

const keys = {};

function isShootKey(code) { return code === "KeyJ" || code === "KeyX"; }
function isJumpKey(code) { return code === "KeyK" || code === "KeyC" || code === "Space" || code === "KeyW" || code === "ArrowUp"; }

window.addEventListener("keydown", (e) => {
  if (isShootKey(e.code) && !keys[e.code]) player.tryRapidFire();
  if (isJumpKey(e.code) && !keys[e.code]) player.tryJump();
  if (e.code === "KeyL" && !keys["KeyL"]) player.startDash(player.facing);

  if ((e.code === "KeyA" || e.code === "ArrowLeft") && !keys[e.code]) handleDirectionPress("left");
  if ((e.code === "KeyD" || e.code === "ArrowRight") && !keys[e.code]) handleDirectionPress("right");

  keys[e.code] = true;
  if (e.code === "Digit1") player.weapon = "PISTOL";
  if (e.code === "Digit2") player.weapon = "SHOTGUN";
});

window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

const touchButtons = document.querySelectorAll(".v-btn[data-code]");
touchButtons.forEach((btn) => {
  const code = btn.getAttribute("data-code");
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (isShootKey(code)) player.tryRapidFire();
    if (isJumpKey(code)) player.tryJump();
    if (code === "KeyL") player.startDash(player.facing);
    if (code === "KeyA") handleDirectionPress("left");
    if (code === "KeyD") handleDirectionPress("right");
    keys[code] = true;
  }, { passive: false });

  btn.addEventListener("touchend", (e) => {
    e.preventDefault();
    keys[code] = false;
  }, { passive: false });

  btn.addEventListener("touchcancel", (e) => {
    e.preventDefault();
    keys[code] = false;
  }, { passive: false });
});

document.getElementById("btn-weapon").addEventListener("touchstart", (e) => {
  e.preventDefault();
  player.weapon = (player.weapon === "PISTOL") ? "SHOTGUN" : "PISTOL";
}, { passive: false });

document.addEventListener("touchmove", (e) => { e.preventDefault(); }, { passive: false });

const LEVEL_WIDTH = 2400;

const camera = {
  x: 0,
  y: 0,
  update(targetX) {
    this.x = targetX - canvas.width * 0.38;
    if (this.x < 0) this.x = 0;
    if (this.x > LEVEL_WIDTH - canvas.width) this.x = LEVEL_WIDTH - canvas.width;
  }
};

const platforms = [
  { x: 0, y: 435, w: LEVEL_WIDTH, h: 25 },
  { x: 140, y: 350, w: 150, h: 14 },
  { x: 650, y: 350, w: 150, h: 14 },
  { x: 1200, y: 350, w: 150, h: 14 },
  { x: 1750, y: 350, w: 160, h: 14 },
  { x: 380, y: 275, w: 160, h: 14 },
  { x: 920, y: 280, w: 160, h: 14 },
  { x: 1480, y: 275, w: 170, h: 14 },
  { x: 2020, y: 280, w: 180, h: 14 }
];

const bullets = [];

class Bullet {
  constructor(x, y, vx, vy, damage, type) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.type = type;
    this.isDead = false;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < -40 || this.x > LEVEL_WIDTH + 40 || this.y < -40 || this.y > canvas.height + 40) {
      this.isDead = true;
    }
  }
  draw(camX) {
    ctx.save();
    ctx.fillStyle = this.type === "SHOTGUN" ? "#e67e22" : "#f1c40f";
    ctx.beginPath();
    ctx.arc(this.x - camX, this.y, this.type === "SHOTGUN" ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// 主角小江物件
const player = {
  x: 80,
  y: 295,
  w: 110,
  h: 140,
  vx: 0,
  vy: 0,
  speed: 4.3,
  jumpForce: -13.5,
  doubleJumpForce: -12.0,
  jumpCount: 0,
  hasAirDashed: false,
  gravity: 0.65,
  friction: 0.8,
  facing: 1,
  aimDir: { x: 1, y: 0 },
  isOnGround: false,
  isCrouching: false,
  isDashing: false,
  dashDuration: 22,
  dashTimer: 0,
  dashCooldown: 0,
  isDashJumping: false,
  shootCooldown: 0,
  shootAnimTimer: 0,
  weapon: "PISTOL",
  hp: 100,
  maxHp: 100,
  invincible: 0,

  startDash(dir) {
    if (this.dashCooldown > 0 || this.isCrouching) return;
    if (!this.isOnGround && this.hasAirDashed) return;

    this.isDashing = true;
    this.facing = dir;
    this.dashTimer = this.dashDuration;
    this.dashCooldown = 30;

    if (!this.isOnGround) {
      this.hasAirDashed = true;
      this.vy = 0;
    }
    this.vx = this.facing * 14.8;
  },

  tryJump() {
    if (this.isCrouching) return;

    if (this.isOnGround) {
      if (this.isDashing) {
        this.isDashJumping = true;
        this.vy = this.jumpForce * 1.05;
        this.vx = this.facing * 14.5;
        this.isDashing = false;
        spawnJumpBurst(this.x, this.y, this.w, this.facing, false, true);
      } else {
        this.isDashJumping = false;
        this.vy = this.jumpForce;
        spawnJumpBurst(this.x, this.y, this.w, this.facing, false, false);
      }
      this.isOnGround = false;
      this.jumpCount = 1;
    } else if (this.jumpCount === 1) {
      this.vy = this.doubleJumpForce;
      this.jumpCount = 2;
      this.isDashing = false;
      spawnJumpBurst(this.x, this.y, this.w, this.facing, true, false);
    }
  },

  tryRapidFire() {
    this.shootCooldown = 0;
    this.fire();
  },

  update() {
    if (this.invincible > 0) this.invincible--;
    if (this.dashCooldown > 0) this.dashCooldown--;
    if (this.shootAnimTimer > 0) this.shootAnimTimer--;

    const isDown = keys["KeyS"] || keys["ArrowDown"];
    this.isCrouching = isDown && this.isOnGround;

    const isLeft = keys["KeyA"] || keys["ArrowLeft"];
    const isRight = keys["KeyD"] || keys["ArrowRight"];
    let moveSpeed = this.isCrouching ? 0 : this.speed;

    if (this.isDashing) {
      this.dashTimer--;
      if (!this.isOnGround) this.vy = 0;
      this.vx = this.facing * 14.8;
      if (this.dashTimer % 2 === 0) {
        spawnDashLines(this.x, this.y, this.w, this.facing, !this.isOnGround);
      }
      if (this.dashTimer <= 0) this.isDashing = false;
    } else if (this.isDashJumping && !this.isOnGround) {
      if (isLeft) this.facing = -1;
      else if (isRight) this.facing = 1;
      this.vx = this.facing * 13.0;
    } else {
      if (isLeft) {
        this.vx = -moveSpeed;
        this.facing = -1;
      } else if (isRight) {
        this.vx = moveSpeed;
        this.facing = 1;
      } else {
        this.vx *= this.friction;
        if (Math.abs(this.vx) < 0.2) this.vx = 0;
      }
    }

    this.aimDir = { x: this.facing, y: 0 };

    if (!this.isDashing || this.isOnGround) {
      this.vy += this.gravity;
    }
    this.x += this.vx;
    this.y += this.vy;

    this.isOnGround = false;
    for (let p of platforms) {
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + Math.max(0, this.vy)) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.isOnGround = true;
          this.jumpCount = 0;
          this.hasAirDashed = false;
          this.isDashJumping = false;
        }
      }
    }

    if (this.x < 0) this.x = 0;
    if (this.x + this.w > LEVEL_WIDTH) this.x = LEVEL_WIDTH - this.w;

    if (this.shootCooldown > 0) this.shootCooldown--;
    if ((keys["KeyJ"] || keys["KeyX"]) && this.shootCooldown === 0) {
      this.fire();
    }
  },

  fire() {
    let startX = this.x + (this.facing === 1 ? this.w * 0.95 : this.w * 0.05);
    let startY = this.isCrouching ? this.y + this.h * 0.55 : this.y + this.h * 0.44;

    this.shootAnimTimer = 8;

    if (this.weapon === "PISTOL") {
      bullets.push(new Bullet(startX, startY, this.aimDir.x * 13, 0, 14, "PISTOL"));
      this.shootCooldown = 10;
    } else if (this.weapon === "SHOTGUN") {
      for (let offset of [-0.22, -0.11, 0, 0.11, 0.22]) {
        const spreadX = this.aimDir.x * Math.cos(offset);
        const spreadY = Math.sin(offset) * 8;
        bullets.push(new Bullet(startX, startY, spreadX * 11, spreadY, 8, "SHOTGUN"));
      }
      this.shootCooldown = 22;
    }
  },

  takeDamage(amount) {
    if (this.invincible > 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.invincible = 50;
    this.vy = -3;
    this.vx = -this.facing * 4;
  },

  draw(camX) {
    if (this.invincible % 4 > 1) return;
    ctx.save();

    let targetImg = imgPlayerStand;
    let isLoaded = isStandLoaded;
    let scaleMultiplier = 1.0;

    if (this.isCrouching) {
      if (isCrouchLoaded) {
        targetImg = imgPlayerCrouch;
        isLoaded = true;
      }
      scaleMultiplier = 1.25;
    } else if (this.isDashing) {
      if (this.dashTimer > this.dashDuration / 2 && isDash1Loaded) {
        targetImg = imgPlayerDash1;
        isLoaded = true;
      } else if (isDash2Loaded) {
        targetImg = imgPlayerDash2;
        isLoaded = true;
      }
    } else if (this.shootAnimTimer > 0 && isShootLoaded) {
      targetImg = imgPlayerShoot;
      isLoaded = true;
    } else if (!this.isOnGround) {
      if (isJumpLoaded) {
        targetImg = imgPlayerJump;
        isLoaded = true;
      }
      scaleMultiplier = 1.2;
    }

    let renderH = 140 * scaleMultiplier;
    let renderW = 268 * scaleMultiplier;

    const offsetX = (renderW - this.w) / 2;
    const renderX = (this.x - offsetX) - camX;
    const renderY = (this.y + this.h) - renderH;

    if (isLoaded) {
      if (this.facing === -1) {
        ctx.translate(renderX + renderW, renderY);
        ctx.scale(-1, 1);
        ctx.drawImage(targetImg, 0, 0, renderW, renderH);
      } else {
        ctx.drawImage(targetImg, renderX, renderY, renderW, renderH);
      }
    } else {
      ctx.fillStyle = this.isDashing ? "#f39c12" : (this.shootAnimTimer > 0) ? "#e74c3c" : "#3498db";
      ctx.fillRect(this.x - camX, this.y, this.w, this.h);
    }

    ctx.restore();
  }
};

const minions = [];
let minionSpawnTimer = 0;

class Minion {
  constructor(x) {
    this.x = x;
    this.y = 385;
    this.w = 32;
    this.h = 50;
    this.hp = 30;
    this.speed = 1.6;
    this.isDead = false;
  }
  update() {
    if (this.x > player.x + 10) this.x -= this.speed;
    else if (this.x < player.x - 10) this.x += this.speed;

    const playerTopY = player.isCrouching ? player.y + 40 : player.y;

    if (Math.abs(this.x - player.x) < (this.w + player.w) * 0.35 &&
        (this.y < player.y + player.h && this.y + this.h > playerTopY)) {
      player.takeDamage(10);
    }

    for (let b of bullets) {
      if (!b.isDead && b.x > this.x && b.x < this.x + this.w && b.y > this.y && b.y < this.y + this.h) {
        this.hp -= b.damage;
        b.isDead = true;
        if (this.hp <= 0) this.isDead = true;
      }
    }
  }
  draw(camX) {
    ctx.save();
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(this.x - camX, this.y, this.w, this.h);
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(this.x - camX, this.y, this.w, 8);
    ctx.restore();
  }
}

// BOSS：力維哥
const boss = {
  x: 2150,
  y: 345,
  w: 65,
  h: 90,
  hp: 600,
  maxHp: 600,
  state: "IDLE",
  timer: 0,
  facing: -1,
  vx: 0,
  isDead: false,
  hitFlash: 0,

  update() {
    if (this.isDead) return;
    if (this.hitFlash > 0) this.hitFlash--;

    if (Math.abs(this.x - player.x) > 850 && this.state === "IDLE") return;

    this.timer++;
    this.facing = (player.x < this.x) ? -1 : 1;

    if (this.state === "IDLE") {
      this.vx = 0;
      if (this.timer > 40) {
        this.timer = 0;
        if (this.hp < this.maxHp * 0.5 && Math.random() < 0.45) {
          this.state = "CHARGE_PREPARE";
          this.timer = 0;
        } else {
          this.state = "WALK";
        }
      }
    } else if (this.state === "WALK") {
      this.vx = this.facing * 1.8;
      this.x += this.vx;

      if (Math.abs(this.x - player.x) < 85) {
        this.state = "PUNCH";
        this.timer = 0;
      }
      if (this.timer > 100) {
        this.state = "IDLE";
        this.timer = 0;
      }
    } else if (this.state === "PUNCH") {
      this.vx = 0;
      if (this.timer === 20) {
        this.vx = this.facing * 5;
        const playerTop = player.isCrouching ? player.y + 40 : player.y;
        if (Math.abs(this.x - player.x) < 95 && playerTop < this.y + 65) {
          player.takeDamage(25);
        }
      }
      if (this.timer > 45) {
        this.state = "IDLE";
        this.timer = 0;
      }
    } else if (this.state === "CHARGE_PREPARE") {
      this.vx = 0;
      if (this.timer > 30) {
        this.state = "CHARGING";
        this.vx = this.facing * 9.5;
        this.timer = 0;
      }
    } else if (this.state === "CHARGING") {
      this.x += this.vx;
      if (Math.abs(this.x - player.x) < 65 && Math.abs(this.y - player.y) < 75) {
        player.takeDamage(35);
      }
      if (this.x <= 1500 || this.x + this.w >= LEVEL_WIDTH - 10) {
        this.state = "STUNNED";
        this.timer = 0;
        this.vx = 0;
      }
    } else if (this.state === "STUNNED") {
      if (this.timer > 60) {
        this.state = "IDLE";
        this.timer = 0;
      }
    }

    for (let b of bullets) {
      if (!b.isDead && b.x > this.x && b.x < this.x + this.w && b.y > this.y && b.y < this.y + this.h) {
        this.hp -= b.damage;
        this.hitFlash = 4;
        b.isDead = true;
        if (this.hp <= 0) {
          this.isDead = true;
          document.getElementById("victory-panel").style.display = "block";
        }
      }
    }
  },

  draw(camX) {
    if (this.isDead) return;
    const renderX = this.x - camX;
    ctx.save();

    if (this.hitFlash > 0) {
      ctx.fillStyle = "#ffffff";
    } else if (this.state === "CHARGE_PREPARE" || this.state === "CHARGING") {
      ctx.fillStyle = "#e74c3c";
    } else if (this.state === "STUNNED") {
      ctx.fillStyle = "#f39c12";
    } else {
      ctx.fillStyle = "#8e44ad";
    }
    ctx.fillRect(renderX, this.y, this.w, this.h);

    ctx.fillStyle = "#d35400";
    ctx.fillRect(this.facing === 1 ? renderX + this.w - 12 : renderX, this.y - 14, 12, 16);

    if (this.state === "PUNCH" && this.timer >= 18 && this.timer <= 26) {
      ctx.fillStyle = "#c0392b";
      const fistX = this.facing === 1 ? renderX + this.w : renderX - 30;
      ctx.fillRect(fistX, this.y + 25, 30, 30);
    }

    ctx.fillStyle = "#333";
    ctx.fillRect(renderX - 10, this.y - 25, this.w + 20, 8);
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(renderX - 10, this.y - 25, ((this.hp / this.maxHp) * (this.w + 20)), 8);

    ctx.fillStyle = "#fff";
    ctx.font = "12px sans-serif";
    ctx.fillText("校園惡霸 - 力維哥", renderX - 10, this.y - 30);

    ctx.restore();
  }
};

function gameLoop() {
  player.update();
  camera.update(player.x);
  boss.update();

  if (!boss.isDead) {
    minionSpawnTimer++;
    if (minionSpawnTimer > 210 && minions.length < 4) {
      const spawnX = Math.random() > 0.5 ? camera.x + canvas.width + 40 : camera.x - 40;
      if (spawnX > 0 && spawnX < LEVEL_WIDTH) {
        minions.push(new Minion(spawnX));
      }
      minionSpawnTimer = 0;
    }
  }

  for (let i = minions.length - 1; i >= 0; i--) {
    minions[i].update();
    if (minions[i].isDead) minions.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].update();
    if (bullets[i].isDead) bullets.splice(i, 1);
  }

  for (let i = fxEffects.length - 1; i >= 0; i--) {
    fxEffects[i].update();
    if (fxEffects[i].life <= 0) fxEffects.splice(i, 1);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#22303c";
  ctx.fillRect(0, 0, canvas.width, 435);

  ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
  ctx.lineWidth = 2;
  for (let wx = 100; wx < LEVEL_WIDTH; wx += 300) {
    if (wx > camera.x - 100 && wx < camera.x + canvas.width + 100) {
      ctx.strokeRect(wx - camera.x, 80, 120, 160);
    }
  }

  for (let bx = 260; bx < LEVEL_WIDTH; bx += 600) {
    if (bx + 260 > camera.x && bx < camera.x + canvas.width) {
      ctx.fillStyle = "#145a32";
      ctx.fillRect(bx - camera.x, 22, 240, 48);
      ctx.strokeStyle = "#7d6608";
      ctx.lineWidth = 3;
      ctx.strokeRect(bx - camera.x, 22, 240, 48);
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.font = "14px sans-serif";
      const roomNum = Math.floor(bx / 600) + 1;
      ctx.fillText(`三重國中 - 3年${roomNum}班`, bx - camera.x + 48, 52);
    }
  }

  for (let p of platforms) {
    if (p.x + p.w > camera.x && p.x < camera.x + canvas.width) {
      if (p.y >= 435) {
        ctx.fillStyle = "#34495e";
        ctx.fillRect(p.x - camera.x, p.y, p.w, p.h);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(p.x - camera.x, p.y, p.w, 3);
      } else {
        ctx.fillStyle = "#a04000";
        ctx.fillRect(p.x - camera.x, p.y, p.w, p.h);
        ctx.fillStyle = "#d35400";
        ctx.fillRect(p.x - camera.x, p.y, p.w, 3);
        ctx.fillStyle = "#5d6d7e";
        ctx.fillRect(p.x - camera.x + 12, p.y + p.h, 6, 12);
        ctx.fillRect(p.x - camera.x + p.w - 18, p.y + p.h, 6, 12);
      }
    }
  }

  for (let fx of fxEffects) fx.draw(camera.x);

  for (let m of minions) m.draw(camera.x);
  boss.draw(camera.x);
  player.draw(camera.x);
  for (let b of bullets) b.draw(camera.x);

  ctx.fillStyle = "#ffffff";
  ctx.font = "14px monospace";
  ctx.fillText(`武器: ${player.weapon} (按 1/2 或 換槍鍵)`, 15, 25);
  ctx.fillText(`小江 HP: ${player.hp} / ${player.maxHp}`, 15, 45);

  ctx.fillStyle = "#444";
  ctx.fillRect(15, 55, 120, 8);
  ctx.fillStyle = "#2ecc71";
  ctx.fillRect(15, 55, (player.hp / player.maxHp) * 120, 8);

  const progressPercent = Math.min(100, Math.round((player.x / (LEVEL_WIDTH - player.w)) * 100));
  ctx.fillStyle = "#bdc3c7";
  ctx.font = "12px monospace";
  ctx.fillText(`關卡進度: ${progressPercent}%`, 15, 80);

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
